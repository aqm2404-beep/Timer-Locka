name: Publish TimerLock APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/publish-release-apk.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TimerLock-v4.3.0.apk
          sha256sum TimerLock-v4.3.0.apk > TimerLock-v4.3.0.sha256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.3.0
          name: TimerLock v4.3.0
          prerelease: true
          generate_release_notes: false
          body: |
            TimerLock v4.3.0 overlay and floating-timer repair build.

            - One overlay permission for TimerLock only; no per-app overlay setup
            - Draggable floating countdown bubble with edge snapping
            - Bubble hides while TimerLock is foreground and returns in background
            - Active timer continues if overlay permission is later revoked
            - Exact-alarm receiver and foreground watchdog retained
            - Device Admin screen-lock request at 00:00 retained
            - Reboot/time-change recovery retained
            - Android 8.0+ / target SDK 35

            Installation notes:
            1. Download TimerLock-v4.3.0.apk.
            2. Allow installation from the browser/file manager if Android requests it.
            3. Open TimerLock and complete exact alarm, notification, overlay and Device Admin setup.
            4. Overlay permission is granted to TimerLock once only; do not enable anything for WhatsApp, Chrome, YouTube or other apps.
          files: |
            TimerLock-v4.3.0.apk
            TimerLock-v4.3.0.sha256.txt
