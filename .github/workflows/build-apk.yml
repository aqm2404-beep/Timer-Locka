name: Build TimerLock Galaxy Store

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build test APK and Galaxy Store AAB
        run: gradle --no-daemon clean assembleDebug bundleRelease --stacktrace

      - name: Verify debug APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/timerlock-badging.txt
          grep -q "package: name='com.timerlock.secure'" /tmp/timerlock-badging.txt
          grep -q "versionCode='7'" /tmp/timerlock-badging.txt
          grep -q "versionName='4.2.0'" /tmp/timerlock-badging.txt
          grep -q "application-label:'TimerLock'" /tmp/timerlock-badging.txt
          sha256sum "$APK"

      - name: Verify Galaxy Store AAB
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB"
          unzip -l "$AAB" | tee /tmp/timerlock-aab-contents.txt
          grep -q 'base/manifest/AndroidManifest.xml' /tmp/timerlock-aab-contents.txt
          grep -q 'base/dex/classes.dex' /tmp/timerlock-aab-contents.txt
          sha256sum "$AAB"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TimerLock-v4.2.0-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Galaxy Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: TimerLock-v4.2.0-Galaxy-Store-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
