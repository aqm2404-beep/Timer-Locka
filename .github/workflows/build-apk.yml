name: Build TimerLock APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Guard overlay architecture
        run: |
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' app/src/main/AndroidManifest.xml
          grep -q 'Settings.canDrawOverlays' app/src/main/java/com/timerlock/secure/SetupGateActivity.java
          grep -q 'TYPE_APPLICATION_OVERLAY' app/src/main/java/com/timerlock/secure/FloatingBubbleController.java
          ! grep -R 'QUERY_ALL_PACKAGES\|PACKAGE_USAGE_STATS\|AccessibilityService' app/src/main || exit 1
          ! grep -R 'getInstalledApplications\|getInstalledPackages' app/src/main || exit 1

      - name: Build debug APK and release AAB
        run: gradle --no-daemon clean assembleDebug bundleRelease --stacktrace

      - name: Verify debug APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/timerlock-badging.txt
          grep -q "package: name='com.timerlock.secure'" /tmp/timerlock-badging.txt
          grep -q "versionCode='8'" /tmp/timerlock-badging.txt
          grep -q "versionName='4.3.0'" /tmp/timerlock-badging.txt
          grep -q "application-label:'TimerLock'" /tmp/timerlock-badging.txt
          sha256sum "$APK"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TimerLock-v4.3.0-overlay-repair-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: TimerLock-v4.3.0-release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
